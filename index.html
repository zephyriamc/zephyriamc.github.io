<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zephyria Network — Wiki & Staff</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --theme-color: #38bdf8;
      --bg-main: #0a0e17;
      --bg-card: #111827;
      --border-card: rgba(56, 189, 248, 0.15);
      --border-hover: rgba(56, 189, 248, 0.5);
    }

    body {
      background-color: var(--bg-main) !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      color: #f1f5f9;
    }

    /* Ocultar elementos innecesarios */
    .sidebar, .sidebar-toggle { display: none !important; }
    .content { padding-left: 0 !important; left: 0 !important; position: relative !important; width: 100% !important; }

    /* Contenedor Principal */
    .markdown-section {
      max-width: 1000px !important;
      margin: 0 auto !important;
      padding: 60px 25px 50px 25px !important;
    }

    /* --- BARRA DE NAVEGACIÓN SUPERIOR (NAVBAR) --- */
    .app-nav {
      position: fixed !important;
      top: 15px !important;
      right: 30px !important;
      margin: 0 !important;
      z-index: 999;
    }

    .app-nav ul {
      display: flex !important;
      gap: 10px !important;
      list-style: none !important;
      padding: 6px 10px !important;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .app-nav a {
      color: #94a3b8 !important;
      padding: 8px 18px !important;
      border-radius: 30px !important;
      font-weight: 700 !important;
      font-size: 0.85rem !important;
      text-decoration: none !important;
      transition: all 0.25s ease !important;
      display: inline-block;
    }

    .app-nav a:hover {
      color: #ffffff !important;
      background: linear-gradient(135deg, #0284c7, #38bdf8) !important;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    /* --- TARJETAS E INTERFAZ DEL INICIO --- */
    .hero-badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .hero-title {
      font-size: 3rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .hero-title span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub {
      color: #94a3b8;
      font-size: 1.1rem;
      max-width: 650px;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    /* Grid de Tarjetas Estilo Menú */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .menu-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 24px;
      text-decoration: none !important;
      color: inherit !important;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .menu-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.15);
      background: #162032;
    }

    .card-icon {
      font-size: 2.2rem;
      margin-bottom: 15px;
      display: inline-block;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .card-btn {
      font-size: 0.85rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Tablas pro */
    table {
      width: 100% !important;
      border-collapse: collapse !important;
      background: var(--bg-card) !important;
      border-radius: 12px !important;
      overflow: hidden !important;
      border: 1px solid var(--border-card) !important;
      margin: 25px 0 !important;
    }

    th {
      background: #1e293b !important;
      color: #38bdf8 !important;
      font-weight: 700 !important;
      padding: 14px 18px !important;
      text-align: left !important;
    }

    td {
      padding: 14px 18px !important;
      border-top: 1px solid rgba(255, 255, 255, 0.05) !important;
      color: #cbd5e1 !important;
    }
  </style>
</head>
<body>
  <div id="app">Cargando Zephyria Wiki...</div>

  <script>
    window.$docsify = {
      name: 'ZEPHYRIA',
      loadNavbar: true,
      loadSidebar: false,
      homepage: 'README.md',
      auto2top: true
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
</html>
