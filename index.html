<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zephyria Network — Wiki & Staff</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --theme-color: #38bdf8;
      --bg-main: #0b0f19;
      --bg-card: #111827;
      --border-card: rgba(56, 189, 248, 0.25);
      --sidebar-width: 280px;
    }

    body {
      background-color: var(--bg-main) !important;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif !important;
      color: #e2e8f0 !important;
    }

    /* BARRA LATERAL (SIDEBAR) CORREGIDA Y ESTILIZADA */
    .sidebar {
      background-color: #0f172a !important;
      border-right: 1px solid rgba(56, 189, 248, 0.15) !important;
      width: var(--sidebar-width) !important;
    }

    .sidebar h1 {
      font-size: 1.4rem !important;
      font-weight: 800 !important;
      color: #38bdf8 !important;
      margin: 20px 0 10px 0 !important;
      text-align: center;
    }

    .sidebar ul li a {
      color: #94a3b8 !important;
      font-size: 0.92rem !important;
      font-weight: 600 !important;
      padding: 8px 12px !important;
      border-radius: 8px !important;
      transition: all 0.2s ease !important;
    }

    .sidebar ul li a:hover {
      color: #38bdf8 !important;
      background: rgba(56, 189, 248, 0.08) !important;
    }

    .sidebar ul li.active > a {
      color: #38bdf8 !important;
      font-weight: 800 !important;
      background: rgba(56, 189, 248, 0.15) !important;
      border-left: 3px solid #38bdf8 !important;
    }

    /* CONTENEDOR PRINCIPAL */
    .content {
      padding-left: var(--sidebar-width) !important;
      position: relative !important;
    }

    .markdown-section {
      max-width: 1050px !important;
      margin: 0 auto !important;
      padding: 40px 35px 80px 35px !important;
    }

    /* TÍTULOS Y TEXTOS */
    h1, h2, h3, h4 {
      color: #f8fafc !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: 800 !important;
      border: none !important;
      margin-top: 1.8em !important;
      margin-bottom: 0.6em !important;
    }

    h1 { font-size: 2.2rem !important; color: #38bdf8 !important; }
    h2 { font-size: 1.6rem !important; border-bottom: 1px solid rgba(56, 189, 248, 0.2) !important; padding-bottom: 8px !important; }
    h3 { font-size: 1.25rem !important; color: #7dd3fc !important; }

    p, li, td {
      color: #cbd5e1 !important;
      font-size: 0.95rem !important;
      line-height: 1.7 !important;
    }

    /* FIX DEFINITIVO PARA TABLAS (ADIÓS FILAS BLANCAS) */
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: separate !important;
      border-spacing: 0 !important;
      background-color: #111827 !important;
      border-radius: 12px !important;
      overflow: hidden !important;
      border: 1px solid rgba(56, 189, 248, 0.25) !important;
      margin: 25px 0 !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3) !important;
    }

    .markdown-section tr {
      background-color: #111827 !important; /* Fuerza fondo oscuro en TODAS las filas */
      border: none !important;
    }

    .markdown-section tr:nth-child(2n) {
      background-color: #1a2332 !important; /* Fila alterna azul oscuro, NUNCA blanca */
    }

    .markdown-section th {
      background-color: #1e293b !important;
      color: #38bdf8 !important;
      font-weight: 800 !important;
      text-transform: uppercase !important;
      font-size: 0.82rem !important;
      letter-spacing: 0.5px !important;
      padding: 14px 18px !important;
      border-bottom: 2px solid rgba(56, 189, 248, 0.3) !important;
      border-top: none !important;
    }

    .markdown-section td {
      padding: 14px 18px !important;
      border-top: 1px solid rgba(255, 255, 255, 0.05) !important;
      color: #e2e8f0 !important;
    }

    /* CAJAS DE INFORMACIÓN Y ALERTAS */
    blockquote {
      background: rgba(56, 189, 248, 0.06) !important;
      border-left: 4px solid #38bdf8 !important;
      color: #94a3b8 !important;
      padding: 16px 20px !important;
      border-radius: 0 12px 12px 0 !important;
      margin: 20px 0 !important;
    }

    code {
      background: #1e293b !important;
      color: #38bdf8 !important;
      padding: 3px 8px !important;
      border-radius: 6px !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 0.88rem !important;
    }

    .admin-box {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 35px;
      border-radius: 16px;
      text-align: center;
      margin-top: 30px;
    }

    .admin-box h2 { color: #ef4444 !important; margin-top: 0 !important; }
    .admin-box p { color: #fca5a5 !important; }
  </style>
</head>
<body>
  <div id="app">Cargando Zephyria Wiki...</div>

  <script>
    window.$docsify = {
      name: 'ZEPHYRIA WIKI',
      loadSidebar: true,
      subMaxLevel: 3,
      homepage: 'README.md',
      auto2top: true,
      executeScript: true
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
</html>
