<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zephyria Network — Wiki & Staff</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --theme-color: #38bdf8;
      --bg-main: #0b0f19;
      --bg-card: #111827;
      --border-card: rgba(56, 189, 248, 0.25);
    }

    body {
      background-color: var(--bg-main) !important;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif !important;
      color: #e2e8f0 !important;
    }

    /* BARRA LATERAL (SIDEBAR) */
    .sidebar {
      background-color: #0f172a !important;
      border-right: 1px solid rgba(56, 189, 248, 0.15) !important;
    }

    .sidebar h1 {
      font-size: 1.3rem !important;
      font-weight: 800 !important;
      color: #38bdf8 !important;
    }

    .sidebar ul li a {
      color: #94a3b8 !important;
      font-weight: 600 !important;
    }

    .sidebar ul li a:hover, .sidebar ul li.active > a {
      color: #38bdf8 !important;
    }

    /* CONTENEDOR PRINCIPAL */
    .markdown-section {
      max-width: 1000px !important;
      margin: 0 auto !important;
      padding: 40px 30px !important;
    }

    h1, h2, h3, h4 {
      color: #f8fafc !important;
      font-weight: 800 !important;
      border: none !important;
    }

    h1 { color: #38bdf8 !important; font-size: 2.2rem !important; }

    /* TRANSFORMACIÓN DE LISTAS EN TARJETAS (PÁGINA PRINCIPAL) */
    .markdown-section > ul {
      display: grid !important;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)) !important;
      gap: 20px !important;
      padding: 0 !important;
      list-style: none !important;
      margin-top: 30px !important;
    }

    .markdown-section > ul > li {
      background: #111827 !important;
      border: 1px solid rgba(56, 189, 248, 0.25) !important;
      border-radius: 12px !important;
      padding: 20px !important;
      transition: all 0.25s ease !important;
      margin: 0 !important;
    }

    .markdown-section > ul > li:hover {
      border-color: #38bdf8 !important;
      transform: translateY(-4px) !important;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15) !important;
      background: #162032 !important;
    }

    .markdown-section > ul > li > a {
      color: #38bdf8 !important;
      font-weight: 800 !important;
      font-size: 1.15rem !important;
      text-decoration: none !important;
      display: block !important;
      margin-bottom: 8px !important;
    }

    .markdown-section > ul > li > p {
      color: #94a3b8 !important;
      font-size: 0.9rem !important;
      line-height: 1.5 !important;
      margin: 0 !important;
    }

    /* FIX DEFINITIVO DE TABLAS */
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: collapse !important;
      background-color: #111827 !important;
      border-radius: 10px !important;
      overflow: hidden !important;
      border: 1px solid rgba(56, 189, 248, 0.25) !important;
      margin: 25px 0 !important;
    }

    .markdown-section tr, 
    .markdown-section tr:nth-child(2n) {
      background-color: #111827 !important;
      border: none !important;
    }

    .markdown-section tr:hover {
      background-color: #1e293b !important;
    }

    .markdown-section th {
      background-color: #1e293b !important;
      color: #38bdf8 !important;
      font-weight: 800 !important;
      padding: 12px 16px !important;
      border-bottom: 2px solid rgba(56, 189, 248, 0.3) !important;
      text-align: left !important;
    }

    .markdown-section td {
      padding: 12px 16px !important;
      border-top: 1px solid rgba(255, 255, 255, 0.05) !important;
      color: #e2e8f0 !important;
    }
  </style>
</head>
<body>
  <div id="app">Cargando Zephyria Wiki...</div>

  <script>
    window.$docsify = {
      name: 'ZEPHYRIA WIKI',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 2,
      homepage: 'README.md',
      auto2top: true
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
</html>
