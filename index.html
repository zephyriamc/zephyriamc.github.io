<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zephyria Staff — Wiki & Panel</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --base-font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --theme-color: #38bdf8; /* Azul cyan brillante */
      --base-background-color: #0b0f19;
      --sidebar-background: #070a10;
      --content-max-width: 1000px;
    }

    body {
      background-color: #0b0f19 !important;
      font-family: var(--base-font-family);
    }

    /* Navbar superior */
    .app-nav {
      position: fixed;
      top: 20px;
      right: 40px;
      margin: 0;
      z-index: 100;
    }

    .app-nav ul {
      display: flex;
      gap: 12px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .app-nav a {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8 !important;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.88rem;
      text-decoration: none !important;
      transition: all 0.2s ease;
    }

    .app-nav a:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: #38bdf8;
      color: #38bdf8 !important;
    }

    /* Hero Section (Estilo PolarMC) */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: 3.2rem !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      margin: 0 0 10px 0 !important;
      letter-spacing: -1px;
      line-height: 1.15 !important;
    }

    .hero-title span {
      color: #38bdf8;
      text-shadow: 0 0 35px rgba(56, 189, 248, 0.45);
    }

    .hero-subtitle {
      color: #64748b !important;
      font-size: 1.05rem !important;
      max-width: 650px;
      margin-bottom: 45px !important;
      line-height: 1.6;
    }

    .section-tag {
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .section-title {
      font-size: 1.8rem !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      margin-top: 0 !important;
      margin-bottom: 25px !important;
    }

    /* Grid de tarjetas (Estilo PolarMC) */
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: #101625;
      border: 1px solid #1a2336;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      transition: all 0.25s ease;
    }

    .card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      background: #131a2c;
      transform: translateY(-2px);
    }

    .card-icon {
      font-size: 2rem;
      line-height: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 12px;
    }

    .card-content h3 {
      margin: 0 0 8px 0 !important;
      color: #ffffff !important;
      font-size: 1.2rem !important;
      font-weight: 700 !important;
    }

    .card-content p {
      color: #64748b !important;
      font-size: 0.9rem !important;
      line-height: 1.5 !important;
      margin: 0 0 16px 0 !important;
    }

    .card-link {
      color: #38bdf8 !important;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none !important;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .card-link:hover {
      text-decoration: underline !important;
    }

    .card-disabled {
      color: #334155 !important;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Ocultar elementos nativos feos */
    .markdown-section h1:first-child { display: none; }
    table { background: #101625 !important; border-radius: 12px; }
    th { background: #161e30 !important; }
    td, th { border-color: #1a2336 !important; }
  </style>
</head>
<body>
  <div id="app">Cargando Wiki...</div>

  <script>
    window.$docsify = {
      name: '<b style="color:#38bdf8">ZEPHYRIA</b>',
      loadNavbar: true,
      loadSidebar: false,
      auto2top: true
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
</body>
</html>
