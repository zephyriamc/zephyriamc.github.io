<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zephyria Network — Wiki & Staff</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --theme-color: #38bdf8;
      --bg-main: #0a0e17;
      --bg-card: #111827;
      --border-card: rgba(56, 189, 248, 0.2);
    }

    body {
      background-color: var(--bg-main) !important;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif !important;
      color: #e2e8f0 !important;
    }

    /* Reset global de colores para evitar letras blancas perdidas */
    h1, h2, h3, h4, h5, h6 {
      color: #f8fafc !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: 800 !important;
      border: none !important;
    }

    p, li, span, div {
      color: #cbd5e1 !important;
      line-height: 1.6;
    }

    /* Ocultar barra lateral */
    .sidebar, .sidebar-toggle { display: none !important; }
    .content { padding-left: 0 !important; left: 0 !important; position: relative !important; width: 100% !important; }

    /* Barra de navegación flotante */
    .app-nav {
      position: fixed !important;
      top: 15px !important;
      right: 30px !important;
      margin: 0 !important;
      z-index: 999;
    }

    .app-nav ul {
      display: flex !important;
      gap: 10px !important;
      list-style: none !important;
      padding: 6px 12px !important;
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .app-nav a {
      color: #94a3b8 !important;
      padding: 8px 18px !important;
      border-radius: 30px !important;
      font-weight: 700 !important;
      font-size: 0.85rem !important;
      text-decoration: none !important;
      transition: all 0.25s ease !important;
      display: inline-block;
    }

    .app-nav a:hover {
      color: #ffffff !important;
      background: #0284c7 !important;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    /* Contenedor principal */
    .markdown-section {
      max-width: 1000px !important;
      margin: 0 auto !important;
      padding: 60px 25px 50px 25px !important;
    }

    /* Badges y Textos Hero */
    .hero-badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8 !important;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .hero-title {
      font-size: 3rem !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      line-height: 1.15 !important;
      margin-bottom: 12px !important;
    }

    .hero-title span {
      color: #38bdf8 !important;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }

    .hero-sub {
      color: #94a3b8 !important;
      font-size: 1.05rem;
      max-width: 650px;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    /* Grid de tarjetas de navegación */
    .nav-grid {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 20px !important;
      margin-top: 20px !important;
    }

    @media (max-width: 768px) {
      .nav-grid { grid-template-columns: 1fr !important; }
    }

    .menu-card {
      background: var(--bg-card) !important;
      border: 1px solid var(--border-card) !important;
      border-radius: 16px !important;
      padding: 24px !important;
      text-decoration: none !important;
      color: inherit !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      transition: all 0.25s ease !important;
    }

    .menu-card:hover {
      border-color: #38bdf8 !important;
      transform: translateY(-4px) !important;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15) !important;
      background: #162032 !important;
    }

    .card-icon {
      font-size: 2rem;
      margin-bottom: 12px;
      display: block;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff !important;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.88rem;
      color: #94a3b8 !important;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .card-btn {
      font-size: 0.85rem;
      font-weight: 700;
      color: #38bdf8 !important;
    }

    /* Estilos de tablas */
    table {
      width: 100% !important;
      border-collapse: collapse !important;
      background: var(--bg-card) !important;
      border-radius: 12px !important;
      overflow: hidden !important;
      border: 1px solid var(--border-card) !important;
      margin: 25px 0 !important;
    }

    th {
      background: #1e293b !important;
      color: #38bdf8 !important;
      font-weight: 700 !important;
      padding: 14px 18px !important;
      text-align: left !important;
    }

    td {
      padding: 14px 18px !important;
      border-top: 1px solid rgba(255, 255, 255, 0.05) !important;
      color: #cbd5e1 !important;
    }

    /* Cajas destacadas de aviso / alertas */
    .admin-box {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      margin-top: 30px;
    }

    .admin-box h2 {
      color: #ef4444 !important;
      margin: 0 0 10px 0 !important;
      font-size: 1.6rem !important;
    }

    .admin-box p {
      color: #fca5a5 !important;
      margin: 0 !important;
    }

    .guide-box {
      background: #111827;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .guide-box h3 {
      color: #38bdf8 !important;
      margin-top: 0 !important;
      margin-bottom: 8px !important;
    }
  </style>
</head>
<body>
  <div id="app">Cargando Zephyria Wiki...</div>

  <script>
    window.$docsify = {
      name: 'ZEPHYRIA',
      loadNavbar: true,
      loadSidebar: false,
      homepage: 'README.md',
      auto2top: true,
      executeScript: true
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
</body>
</html>
